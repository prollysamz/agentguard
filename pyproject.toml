[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentguard-oss"
version = "0.2.0"
description = "Open-source safety layer for AI agent tool calls: policy, risk checks, human approval and tamper-evident audit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sameer Jakkuva" }]
keywords = ["ai-agents", "ai-safety", "guardrails", "llm-security", "mcp", "gemma", "policy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.9,<3", "PyYAML>=6.0.2,<7", "portalocker>=3,<4", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2", "twine>=7,<8", "langgraph>=1,<2", "fakeredis>=2.26,<3"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]
mcp = ["mcp>=1.12,<2"]
langchain = ["langchain-core>=1,<2"]
openai-agents = ["openai-agents>=0.23,<1"]
adk = ["google-adk>=2,<3"]
redis = ["redis>=5,<9"]
all = ["agentguard-oss[mcp,langchain,openai-agents,adk,redis]"]

[project.urls]
Homepage = "https://github.com/prollysamz/agentguard"
Documentation = "https://prollysamz.github.io/agentguard/"
Repository = "https://github.com/prollysamz/agentguard"
Issues = "https://github.com/prollysamz/agentguard/issues"
Changelog = "https://github.com/prollysamz/agentguard/blob/main/CHANGELOG.md"

[project.scripts]
agentguard = "agentguard.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["agentguard"]

[tool.hatch.build.targets.sdist]
include = ["agentguard", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ADK warns about its own experimental schema feature on every declaration.
filterwarnings = ['ignore:\[EXPERIMENTAL\]:UserWarning']

[tool.ruff]
line-length = 100
target-version = "py311"
# Ruff can format Markdown code blocks, which breaks pymdownx snippet directives.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
