[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentguard-sdk"
version = "0.1.0"
description = "Policy enforcement and runtime safety for AI agent tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.9,<3", "PyYAML>=6.0.2,<7", "portalocker>=3,<4", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2", "langgraph>=1,<2"]
mcp = ["mcp>=1.12,<2"]
langchain = ["langchain-core>=1,<2"]
openai-agents = ["openai-agents>=0.23,<1"]
adk = ["google-adk>=2,<3"]
all = ["agentguard-sdk[mcp,langchain,openai-agents,adk]"]

[project.scripts]
agentguard = "agentguard.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["agentguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ADK warns about its own experimental schema feature on every declaration.
filterwarnings = ['ignore:\[EXPERIMENTAL\]:UserWarning']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

