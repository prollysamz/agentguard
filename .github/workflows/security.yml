name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 1'  # Weekly, for newly published advisories.

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[all]" pip-audit
      - name: Audit installed dependencies for known vulnerabilities
        run: python -m pip_audit --progress-spinner off --skip-editable

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install "bandit>=1.8,<2"
      - run: python -m bandit -q -r agentguard
