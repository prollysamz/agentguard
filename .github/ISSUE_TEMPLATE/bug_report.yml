name: Bug report
description: Something in AgentGuard does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        **Security issues go to
        [private vulnerability reporting](https://github.com/prollysamz/agentguard/security/advisories/new),
        not here.** That includes any action that ran when policy, risk or approval should have
        stopped it. Do not paste credentials, tokens or personal data; use synthetic values.
  - type: checkboxes
    id: not-security
    attributes:
      label: Not a vulnerability
      options:
        - label: This report does not describe a way to bypass a control, and contains no secrets.
          required: true
  - type: input
    id: version
    attributes:
      label: AgentGuard version
      description: Output of `python -c "import agentguard; print(agentguard.__version__)"`
      placeholder: 0.4.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
      placeholder: Python 3.12, Windows 11
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Policy or risk scoring
        - Approvals or dashboard
        - Executors or isolation
        - Audit log
        - Integration (LangChain, OpenAI Agents SDK, Google ADK, MCP)
        - CLI or demo
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The policy, the tool registration and the call, as small as possible.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
      description: >-
        Include the decision and reasons, e.g. from `agentguard explain` or the audit log
        (`agentguard inspect`), with any sensitive values removed.
    validations:
      required: true
